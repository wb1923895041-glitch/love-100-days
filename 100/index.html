<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 DAYS - WANG BO</title>
    
    <!-- 使用国内最稳定的 CDN 链接 (Staticfile) -->
    <script src="https://cdn.staticfile.org/vue/3.2.37/vue.global.prod.min.js"></script>
    
    <!-- 字体库 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;400;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-gold: #c4a484;
            --soft-pink: #ffafbd;
            --text-dark: #2c2c2c;
            --glass-white: rgba(255, 255, 255, 0.6);
            --bg-cream: #f9f7f2;
            --transition-slow: all 1.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-cream);
            color: var(--text-dark);
            font-family: 'Noto Serif SC', serif;
            overflow: hidden;
            height: 100vh;
        }

        .stage-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #fffcf8 0%, #f2eee5 100%);
        }

        .ambient-glow {
            position: absolute;
            width: 80vw; height: 80vw;
            background: var(--soft-pink);
            filter: blur(120px);
            border-radius: 50%;
            opacity: 0.15;
            animation: pulse 15s infinite alternate;
        }

        @keyframes pulse {
            from { transform: translate(-10%, -10%); opacity: 0.1; }
            to { transform: translate(10%, 10%); opacity: 0.25; }
        }

        #app {
            height: 100vh;
            display: grid;
            place-items: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            position: relative;
        }

        .photo-wrap {
            width: 160px;
            height: 200px;
            background: white;
            margin: 0 auto 2.5rem;
            padding: 10px 10px 35px 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
            transform: rotate(-2deg);
            transition: var(--transition-slow);
            border: 1px solid rgba(0,0,0,0.02);
        }
        .photo-wrap:hover { transform: rotate(0deg) scale(1.05); }
        .photo-wrap img { width: 100%; height: 100%; object-fit: cover; filter: sepia(10%); }

        .glass-view {
            background: var(--glass-white);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 3rem 2rem;
            border-radius: 4px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.03);
            position: relative;
            z-index: 2;
        }

        .bg-number {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Playfair Display', serif;
            font-size: 20rem;
            font-style: italic;
            color: var(--primary-gold);
            opacity: 0.08;
            z-index: 1;
            pointer-events: none;
        }

        .meta-tag {
            font-size: 0.75rem;
            letter-spacing: 0.5rem;
            color: var(--primary-gold);
            margin-bottom: 2rem;
            display: block;
            font-weight: 300;
        }

        .message-body {
            font-size: 1.1rem;
            line-height: 2.5;
            letter-spacing: 0.1rem;
            color: #3d3d3d;
            text-align: justify;
            min-height: 150px;
        }

        .timer-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-top: 3rem;
            border-top: 1px solid rgba(0,0,0,0.05);
            padding-top: 2rem;
        }
        .timer-unit b {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 400;
            display: block;
        }
        .timer-unit label {
            font-size: 0.6rem;
            text-transform: uppercase;
            color: var(--primary-gold);
            letter-spacing: 2px;
        }

        .signature {
            margin-top: 3.5rem;
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-style: italic;
            letter-spacing: 0.1rem;
        }

        .btn-open {
            background: none;
            border: 1px solid var(--primary-gold);
            padding: 1rem 3rem;
            color: var(--primary-gold);
            letter-spacing: 4px;
            cursor: pointer;
            transition: 0.5s;
            font-size: 0.85rem;
        }
        .btn-open:hover { background: var(--primary-gold); color: white; }

        .v-enter-active, .v-leave-active { transition: var(--transition-slow); }
        .v-enter-from, .v-leave-to { opacity: 0; transform: translateY(30px); }

        @media (max-width: 600px) {
            .bg-number { font-size: 12rem; }
            .message-body { font-size: 0.95rem; line-height: 2.2; }
        }
    </style>
</head>
<body>

    <div class="stage-bg">
        <div class="ambient-glow"></div>
    </div>

    <div id="app">
        <transition mode="out-in">
            <!-- 场景1：封面 -->
            <div v-if="state === 'intro'" key="intro" class="container">
                <button class="btn-open" @click="enter">开启 100 天纪念</button>
            </div>

            <!-- 场景2：主内容 -->
            <div v-else-if="state === 'content'" key="content" class="container">
                <div class="bg-number">100</div>
                
                <div class="glass-view">
                    <div class="photo-wrap">
                        <img src="us.jpg" alt="US">
                    </div>

                    <span class="meta-tag">SINCE 2025.11.04</span>
                    
                    <div class="message-body">
                        {{ typedText }}<span style="color: var(--primary-gold)">|</span>
                    </div>

                    <div class="timer-group">
                        <div class="timer-unit"><b>{{ timer.d }}</b><label>Days</label></div>
                        <div class="timer-unit"><b>{{ timer.h }}</b><label>Hrs</label></div>
                        <div class="timer-unit"><b>{{ timer.m }}</b><label>Min</label></div>
                        <div class="timer-unit"><b>{{ timer.s }}</b><label>Sec</label></div>
                    </div>

                    <div class="signature">Yours, Wang Bo</div>
                </div>
            </div>
        </transition>

        <!-- 慢慢喜欢你 音乐播放器 -->
        <audio id="bgm" loop preload="auto">
            <source src="https://music.163.com/song/media/outer/url?id=536622304.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        // 初始化 Vue
        (function() {
            if (typeof Vue === 'undefined') {
                alert("Vue 框架加载失败，请检查网络连接或尝试刷新页面。");
                return;
            }

            const { createApp, ref, reactive, onMounted } = Vue;

            createApp({
                setup() {
                    const state = ref('intro');
                    const typedText = ref("");
                    const timer = reactive({ d: 0, h: 0, m: 0, s: 0 });
                    const startDate = new Date('2025-11-04 00:00:00');
                    
                    const fullText = "这一百天，我不曾写过华丽的诗。我只是在清晨的阳光里想起你，在日落的余晖中等待你。2025年11月4日，那是我生命中最重要的转折点。我想和你一起，慢慢喜欢你，慢慢陪你虚度剩下的所有时光。纪念日快乐！";

                    const updateTimer = () => {
                        setInterval(() => {
                            const now = new Date();
                            const diff = now - startDate;
                            timer.d = Math.floor(diff / 86400000);
                            timer.h = Math.floor((diff % 86400000) / 3600000);
                            timer.m = Math.floor((diff % 3600000) / 60000);
                            timer.s = Math.floor((diff % 60000) / 1000);
                        }, 1000);
                    };

                    const startTyping = () => {
                        let i = 0;
                        const interval = setInterval(() => {
                            typedText.value += fullText[i];
                            i++;
                            if (i >= fullText.length) clearInterval(interval);
                        }, 130);
                    };

                    const enter = () => {
                        state.value = 'content';
                        const audio = document.getElementById('bgm');
                        audio.play().catch(e => console.log("播放被拦截或失败:", e));
                        
                        // 兼容微信
                        if (window.WeixinJSBridge) {
                            WeixinJSBridge.invoke('getNetworkType', {}, function() {
                                audio.play();
                            });
                        }
                        setTimeout(startTyping, 1800); 
                    };

                    onMounted(() => {
                        updateTimer();
                    });

                    return { state, timer, typedText, enter };
                }
            }).mount('#app');
        })();
    </script>
</body>
</html>
